<section class="contact-section section-shell" id="contact">
  <div class="contact-copy">
    <p class="eyebrow">Good things start with a conversation</p>
    <h2>Curious what your<br>waste could <span>do?</span></h2>
    <p>Tell us a little about your idea or your operation. We'll be in touch to learn more.</p>
    <div class="contact-note"><span class="contact-note-icon" aria-hidden="true">✳</span><span>Home, farm, community, or business.<br>Every good idea has a beginning.</span></div>
    <div class="contact-details">
      <a href="mailto:gilbert12k@gmail.com">gilbert12k@gmail.com</a>
      <a href="tel:+254791606268">+254 791 606 268</a>
    </div>
  </div>
  <form class="contact-form" id="contact-form">
    <label for="name">Your Name</label>
    <input id="name" name="name" type="text" autocomplete="name" maxlength="100" placeholder="e.g. John Doe" required>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="alex@example.com" required>
    <label for="message">What's on your mind?</label>
    <textarea id="message" name="message" rows="4" maxlength="5000" placeholder="Tell us about your home, farm, or project..." required></textarea>
    <button class="button button-primary form-submit" type="submit">Send your message <span aria-hidden="true">↗</span></button>
    <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
  </form>
</section>
